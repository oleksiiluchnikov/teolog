[package]
name = "teolog"
version = "0.1.0"
edition = "2021"
description = "Cross-stack wide-event structured logging for Rust, TypeScript, and Lua"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.2"
ureq = { version = "2", optional = true }

[features]
default = []
http-sink = ["ureq"]

[dev-dependencies]
tempfile = "3"
